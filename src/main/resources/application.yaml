spring:
  application:
    name: StoreManagement
  mvc:
    log-request-details: true
  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=Store_Management;encrypt=true;trustServerCertificate=true
    username: sa
    password: 123456
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: 15679
  error:
    include-message: always

logging:
  charset:
    console: UTF-8
  level:
    com.joao.storemanagement: debug
    org.springframework.web: debug
    org.springframework.jdbc: debug
    com.baomidou.mybatisplus: debug

mybatis-plus:
  mapper-locations: classpath:/mapper/primary/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

store:
  database:
    backup-dir: backups/db
    reset-target-name: Store_Management
